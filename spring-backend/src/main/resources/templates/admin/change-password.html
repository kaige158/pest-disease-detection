<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${param.lang != null ? param.lang : (uiLang != null ? uiLang : 'zh')}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{pwd.changeTitle} + ' — ' + #{app.name}">修改密码</title>
    <link rel="stylesheet" href="/css/admin.css">
    <th:block th:replace="~{admin/fragments :: adminStyles}"></th:block>
    <style>
        .pwd-card { max-width: 460px; }
        .pwd-card label { display: block; font-size: 13px; color: #555; font-weight: 600; margin-bottom: 6px; }
        .pwd-card input {
            width: 100%; padding: 11px 12px; border: 1px solid #DDD; border-radius: 6px;
            font-size: 14px; box-sizing: border-box; margin-bottom: 14px;
        }
        .pwd-card input:focus { outline: none; border-color: #4CAF50; }
        .pwd-hint { font-size: 12px; color: #999; margin: -8px 0 14px; }
        .pwd-alert { padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
        .pwd-alert.err { background: #FFEBEE; border: 1px solid #EF9A9A; color: #B71C1C; }
        .pwd-alert.ok { background: #E8F5E9; border: 1px solid #A5D6A7; color: #1B5E20; }
    </style>
</head>
<body>
    <nav th:replace="~{admin/fragments :: sidebar('change-password')}"></nav>

    <div class="main">
        <div th:replace="~{admin/fragments :: topbar(#{pwd.changeTitle}, '🔐')}"></div>

        <div class="pwd-banner" th:if="${mustChangePassword}">
            <div class="pwd-banner-icon">🔐</div>
            <div class="pwd-banner-body">
                <b th:text="#{pwd.warnTitle}">请立即修改初始密码</b>
                <div th:text="#{pwd.warnBody}">当前密码是系统初始密码或已被重置…</div>
            </div>
        </div>

        <div class="card pwd-card" style="padding:24px;">
            <div class="pwd-alert ok" th:if="${param.done != null}" th:text="#{pwd.success}">密码已修改，请重新登录</div>
            <div class="pwd-alert err" th:if="${param.error != null}" th:text="${errorMessage} ?: #{pwd.failed}">修改失败</div>

            <!-- 走服务端表单提交：后台没有前端构建链，服务端渲染最省事也最可靠 -->
            <form th:action="@{/admin/change-password}" method="post" id="pwdForm">
                <label for="oldPassword" th:text="#{pwd.oldPassword}">当前密码</label>
                <input id="oldPassword" type="password" name="oldPassword"
                       autocomplete="current-password" required autofocus>

                <label for="newPassword" th:text="#{pwd.newPassword}">新密码</label>
                <input id="newPassword" type="password" name="newPassword"
                       autocomplete="new-password" required>
                <div class="pwd-hint" th:text="#{pwd.newPasswordHint}">至少 6 位，建议包含字母与数字</div>

                <label for="confirmPassword" th:text="#{pwd.confirmPassword}">确认新密码</label>
                <input id="confirmPassword" type="password" name="confirmPassword"
                       autocomplete="new-password" required>

                <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;"
                        th:text="#{pwd.submit}">确认修改</button>
            </form>
        </div>
    </div>

    <script>
        // 前端先做一次一致性校验，减少无意义的服务端往返
        document.getElementById('pwdForm').addEventListener('submit', function (e) {
            var np = document.getElementById('newPassword').value;
            var cp = document.getElementById('confirmPassword').value;
            var messages = {
                zh: ['两次输入的新密码不一致', '新密码至少 6 位'],
                lo: ['ລະຫັດຜ່ານໃໝ່ສອງຄັ້ງບໍ່ຕົງກັນ', 'ລະຫັດຜ່ານໃໝ່ຢ່າງໜ້ອຍ 6 ຕົວ']
            };
            var lang = document.documentElement.getAttribute('lang') || 'zh';
            var m = messages[lang] || messages.zh;
            if (np.length < 6) { alert(m[1]); e.preventDefault(); return; }
            if (np !== cp) { alert(m[0]); e.preventDefault(); }
        });
    </script>
</body>
</html>
