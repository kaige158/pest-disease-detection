<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI审核中心 — 农业AI平台</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">🌱 农业AI平台<small>专家管理后台</small></div>
        <a href="/admin/dashboard"><span class="icon">📊</span> <span>仪表盘</span></a>
        <a href="/admin/review" class="active"><span class="icon">🔍</span> <span>AI审核中心</span></a>
        <a href="/admin/knowledge"><span class="icon">📚</span> <span>知识库管理</span></a>
        <a href="/admin/stats"><span class="icon">📈</span> <span>数据统计</span></a>
    </nav>

    <div class="main">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h2>🔍 AI审核中心</h2>
            <span class="badge badge-warning" th:text="'待审核: ' + ${pendingCount} + ' 条'">待审核: 0 条</span>
        </div>

        <!-- 批量操作 -->
        <div class="card" style="padding:12px 16px;display:flex;gap:8px;align-items:center;">
            <span style="font-size:13px;color:#666;">快捷操作:</span>
            <button class="btn btn-primary btn-sm" onclick="batchApproveHighConfidence()">✅ 一键通过高置信度(≥90%)</button>
            <span id="batchResult" style="font-size:12px;color:#4CAF50;display:none;"></span>
        </div>

        <!-- 待审核列表 -->
        <div class="card" th:if="${!#lists.isEmpty(pendingList)}">
            <table>
                <thead>
                    <tr>
                        <th style="width:80px;">图片</th>
                        <th>AI识别结果</th>
                        <th>置信度</th>
                        <th>位置/时间</th>
                        <th style="width:200px;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${pendingList}">
                        <td>
                            <img th:src="${record.imageUrl} ?: '/images/placeholder.png'"
                                 style="width:60px;height:60px;object-fit:cover;border-radius:4px;"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect fill=%22%23eee%22 width=%2260%22 height=%2260%22/><text x=%2220%22 y=%2235%22 fill=%22%23999%22>图片</text></svg>'">
                        </td>
                        <td>
                            <div style="font-weight:600;" th:text="${record.topDiseaseId} ?: '未知'">-</div>
                            <div style="font-size:12px;color:#666;" th:text="${record.providerUsed}">-</div>
                        </td>
                        <td>
                            <div class="confidence" th:classappend="${record.confidenceLevel} ?: 'medium'">
                                <span th:text="${record.topConfidence} != null ? ${#numbers.formatDecimal(record.topConfidence * 100, 1, 0)} + '%' : '-'">-</span>
                                <div class="bar"><div class="fill" th:style="'width:' + (${record.topConfidence} != null ? ${record.topConfidence * 100} : 0) + '%'"></div></div>
                            </div>
                        </td>
                        <td>
                            <div style="font-size:12px;" th:text="${record.locationName} ?: '未知位置'">-</div>
                            <div style="font-size:11px;color:#999;" th:text="${record.createdAt}">-</div>
                        </td>
                        <td>
                            <button class="btn btn-primary btn-sm" th:onclick="'openReview(' + ${record.id} + ')'">🔍 审核</button>
                            <button class="btn btn-outline btn-sm" th:onclick="'quickApprove(' + ${record.id} + ')'">✅ 确认</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(pendingList)}">
            <div class="icon">🎉</div>
            <p>暂无待审核记录</p>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
