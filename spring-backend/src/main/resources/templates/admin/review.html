<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${param.lang != null ? param.lang : (uiLang != null ? uiLang : 'zh')}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{review.title} + ' — ' + #{app.name}">AI审核中心</title>
    <link rel="stylesheet" href="/css/admin.css">
    <th:block th:replace="~{admin/fragments :: adminStyles}"></th:block>
</head>
<body>
    <nav th:replace="~{admin/fragments :: sidebar('review')}"></nav>

    <div class="main">
        <div th:replace="~{admin/fragments :: topbar(#{review.title}, '🔍')}"></div>
        <div th:replace="~{admin/fragments :: passwordBanner}"></div>

        <!-- 待审核列表 -->
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th style="width:90px;" th:text="#{review.image}">图片</th>
                        <th th:text="#{review.disease}">识别结果</th>
                        <th style="width:110px;" th:text="#{review.confidence}">置信度</th>
                        <th style="width:150px;" th:text="#{users.lastLogin}">时间</th>
                        <th style="width:170px;" th:text="#{review.actions}">审核操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${pendingList}">
                        <td>
                            <span style="font-size:12px;color:#666;"
                                  th:text="${record.imageUrl} ?: '-'">-</span>
                        </td>
                        <td th:text="${record.parsedResults} ?: '-'">-</td>
                        <td>
                            <span class="badge badge-warning"
                                  th:text="${record.topConfidence}">-</span>
                        </td>
                        <td>
                            <div style="font-size:12px;" th:text="${record.locationName} ?: '-'">-</div>
                            <div style="font-size:11px;color:#999;" th:text="${record.createdAt}">-</div>
                        </td>
                        <td>
                            <button class="btn btn-primary btn-sm"
                                    th:onclick="'openReview(' + ${record.id} + ')'">🔍</button>
                            <button class="btn btn-outline btn-sm"
                                    th:onclick="'quickApprove(' + ${record.id} + ')'">✅</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(pendingList)}">
            <div class="icon">🎉</div>
            <p th:text="#{review.empty}">暂无待审核记录</p>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
