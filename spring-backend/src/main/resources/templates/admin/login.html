<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${param.lang != null ? param.lang : (uiLang != null ? uiLang : 'zh')}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title} + ' — ' + #{app.name}">登录</title>
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 70px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h1 { font-size: 24px; margin-bottom: 8px; }
        .login-container p.sub { color: #666; margin-bottom: 22px; font-size: 14px; }
        .login-container label {
            display: block; text-align: left; font-size: 13px;
            color: #555; font-weight: 600; margin-bottom: 5px;
        }
        .login-container input {
            width: 100%; padding: 12px; margin-bottom: 16px;
            border: 1px solid #E0E0E0; border-radius: 6px; font-size: 14px;
            box-sizing: border-box;
        }
        .login-container input:focus { outline: none; border-color: #4CAF50; }
        .login-container .btn { width: 100%; padding: 12px; font-size: 15px; cursor: pointer; }
        .alert {
            padding: 10px 12px; border-radius: 6px; font-size: 13px;
            margin-bottom: 16px; text-align: left;
        }
        .alert-error { background: #FFEBEE; border: 1px solid #EF9A9A; color: #B71C1C; }
        .alert-ok { background: #E8F5E9; border: 1px solid #A5D6A7; color: #1B5E20; }
        .lang-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
        .lang-row a {
            padding: 5px 16px; border-radius: 16px; font-size: 12px; text-decoration: none;
            border: 1px solid #CFD8DC; color: #607D8B;
        }
        .lang-row a.on { background: #4CAF50; color: #fff; border-color: #4CAF50; font-weight: 600; }
        .hint {
            font-size: 11px; color: #999; margin-top: 18px; line-height: 1.7;
            text-align: left; background: #FAFAFA; padding: 10px 12px; border-radius: 6px;
        }
        .hint code { background: #EEE; padding: 1px 4px; border-radius: 3px; }
    </style>
</head>
<body style="background:#E8F5E9;">
    <div class="login-container">
        <h1>🌱 <span th:text="#{app.name}">农业AI平台</span></h1>
        <p class="sub" th:text="#{login.subtitle}">专家管理后台</p>

        <!-- 语言切换：老挝同事接手时先切成老挝语 -->
        <div class="lang-row">
            <a href="?lang=zh" th:classappend="${#locale.language == 'zh'} ? 'on'">中文</a>
            <a href="?lang=lo" th:classappend="${#locale.language == 'lo'} ? 'on'">ລາວ</a>
        </div>

        <!-- 登录失败提示：Spring Security 认证失败会跳到 /admin/login?error=1 -->
        <div class="alert alert-error" th:if="${param.error != null}">
            ❌ <span th:text="#{login.error}">账号或密码不正确</span>
            <div style="margin-top:4px;font-size:12px;" th:text="#{login.errorHint}">
                默认管理员账号是 admin。
            </div>
        </div>

        <!-- 改密成功后的提示（改密会强制重新登录） -->
        <div class="alert alert-ok" th:if="${param.pwdChanged != null}" th:text="#{pwd.success}">
            密码已修改，请重新登录
        </div>

        <!-- 退出成功 / 会话过期 -->
        <div class="alert alert-ok" th:if="${param.logout != null}" th:text="#{login.logoutOk}">已安全退出登录</div>
        <div class="alert alert-ok" th:if="${param.expired != null}" th:text="#{login.expired}">登录已过期</div>

        <!--
            必须 POST 到 /admin/login（Spring Security 的登录处理地址），
            且字段名必须是 username / password。
        -->
        <form th:action="@{/admin/login}" method="post">
            <label for="username" th:text="#{login.account}">账号</label>
            <input id="username" type="text" name="username"
                   th:placeholder="#{login.accountPlaceholder}"
                   autocomplete="username" autofocus required>

            <label for="password" th:text="#{login.password}">密码</label>
            <input id="password" type="password" name="password"
                   th:placeholder="#{login.passwordPlaceholder}"
                   autocomplete="current-password" required>

            <button type="submit" class="btn btn-primary" th:text="#{login.submit}">登 录</button>
        </form>

        <div class="hint">
            <b th:text="#{login.forgotTitle}">忘记密码怎么办？</b><br>
            <span th:text="#{login.forgotBody}">管理员密码由后端初始化时写入，可用以下方式重置：</span><br>
            1. <span th:text="#{login.forgotStep1}">在项目根目录执行重置脚本（仅本机可用）</span><br>
            &nbsp;&nbsp;&nbsp;<code>powershell -File scripts\reset_admin_password.ps1 -Password 新密码</code><br>
            2. <span th:text="#{login.forgotStep2}">或设置环境变量后重启服务</span><br>
            <span style="color:#C62828;" th:text="#{login.demoWarning}">演示档使用内存数据库，重启会清空数据。</span>
        </div>
    </div>
</body>
</html>
