<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${param.lang != null ? param.lang : (uiLang != null ? uiLang : 'zh')}">
<head>
    <meta charset="UTF-8">
    <title>农业AI服务平台 — 专家后台</title>
    <link rel="stylesheet" href="/css/admin.css">
    <th:block th:replace="~{admin/fragments :: adminStyles}"></th:block>
</head>
<body>
    <!-- 侧边栏 -->
    <nav th:replace="{~{admin/fragments :: sidebar('dashboard')}}"></nav>

    <!-- 主内容区 -->
    <div class="main">
        <!-- 顶部栏 -->
        <div th:replace="~{admin/fragments :: topbar(#{dashboard.title}, '📊')}"></div>
        <div th:replace="~{admin/fragments :: passwordBanner}"></div>

        <!-- 内容插槽 -->
        <div th:insert="~{::content}"></div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
