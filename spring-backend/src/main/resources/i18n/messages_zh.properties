# ---------- 角色定位（一句话说明每个角色是干什么的）----------
role.desc.ADMIN=平台管理员：技术/运营负责人，拥有全部权限（含账号安全与 AI 密钥）
role.desc.EXPERT=农业专家（老师）：负责审核识别结果与维护知识库内容，不碰账号与密钥
role.desc.TECHNICIAN=农技推广员：只读 + 可提交审核结论，不能修改知识库
role.desc.FARMER=农户：只能用手机 APP，无后台权限

