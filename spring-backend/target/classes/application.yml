# ==========================================
# 中老双语农业病虫害防控平台 — 应用配置
# 所有敏感信息通过环境变量注入，绝不硬编码
# ==========================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: laos-agri-platform

  # 数据源 (PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laos_agri}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate  # 生产用validate，开发期可用update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: core
    open-in-view: false  # 性能优化

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 国际化默认语言
  web:
    locale: zh

  # Jackson JSON配置
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ==========================================
# AI服务配置
# ==========================================
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 10s
    read-timeout: 30s

# ==========================================
# JWT配置
# ==========================================
jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits}
  expiration-hours: ${JWT_EXPIRE_HOURS:24}

# ==========================================
# 文件存储
# ==========================================
storage:
  upload-dir: ${UPLOAD_DIR:./uploads}
  allowed-image-types: image/jpeg,image/png,image/webp

# ==========================================
# 文档
# ==========================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

# ==========================================
# 日志
# ==========================================
logging:
  level:
    root: INFO
    com.laos.agri: DEBUG
    org.springframework.security: INFO
