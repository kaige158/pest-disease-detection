# ==========================================================
# Nginx 反向代理 —— 唯一对外入口
#
# 阶段 1（现在）：只用 80 端口，浏览器通过 http://<公网IP> 访问
# 阶段 2（有域名后）：放开下面被注释的 443 段，跑一次 certbot 签证书
#
# 关键配置说明：
#   client_max_body_size 12m  —— APP 上传图片上限 10MB，Nginx 默认只有 1MB，
#                                不改的话农户一拍照就 413（这个坑很常见）
#   proxy_read_timeout 180s   —— AI 识别走的是同步调用，慢的时候要几十秒
#   proxy_request_buffering off —— 大图直接透传给后端，不先落盘到 Nginx，省内存
# ==========================================================

upstream laos_backend {
    server spring:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;          # 有域名后改成你的域名，例如 api.example.com

    charset utf-8;
    client_max_body_size 12m;

    # ---- Let's Encrypt 证书校验目录（阶段 2 用，现在放着不影响）----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- 上传的识别图片 ----
    # 直接由 Nginx 从磁盘读，不经过 JVM：图片多的时候能省下大量后端内存与 CPU
    location /uploads/ {
        alias /data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- 其余全部转发给 Spring Boot（后台页面 + /api/v1）----
    location / {
        proxy_pass http://laos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # 10MB 图片上传时不落到 Nginx 临时文件
        proxy_request_buffering off;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}

